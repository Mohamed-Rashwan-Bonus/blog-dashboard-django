<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}المدونة{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
{% load static %}<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background:#0f172a">
<div class="container">
<a class="navbar-brand fw-bold" href="{% url 'blog:post_list' %}"><i class="bi bi-journal-text"></i> مدونتي.</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<form class="d-flex me-auto" method="get" action="{% url 'blog:post_list' %}">
<input name="q" value="{{ request.GET.q }}" class="form-control me-2" placeholder="ابحث في المقالات...">
<button class="btn btn-outline-light">بحث</button>
</form>
<ul class="navbar-nav">
{% if user.is_authenticated %}
<li class="nav-item"><a class="nav-link" href="{% url 'blog:post_create' %}"><i class="bi bi-plus-circle"></i> مقال جديد</a></li>
<li class="nav-item"><a class="nav-link" href="/admin/">لوحة التحكم</a></li>
<li class="nav-item"><span class="nav-link">{{ user.username }}</span></li>
<li class="nav-item"><form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-outline-light">خروج</button></form></li>
{% else %}
<li class="nav-item"><a class="nav-link" href="{% url 'login' %}">دخول</a></li>
<li class="nav-item"><a class="btn btn-warning btn-sm" href="{% url 'register' %}">حساب جديد</a></li>
{% endif %}
</ul>
</div></div></nav>
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080">
{% for m in messages %}<div class="toast show text-bg-success border-0"><div class="d-flex"><div class="toast-body">{{ m }}</div></div></div>{% endfor %}
</div>
<main class="container my-4">{% block content %}{% endblock %}</main>
<footer class="text-center text-muted py-4 small">© 2026 مدونتي — محمد رشوان</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
